<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#F4A300"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- swinging lantern -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-14 200 20; 14 200 20; -14 200 20" dur="3.6s"
      repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" keyTimes="0;0.5;1"/>

    <!-- rope -->
    <line x1="200" y1="20" x2="200" y2="105" stroke="url(#g)" stroke-width="3"/>

    <!-- glow -->
    <circle cx="200" cy="170" r="90" fill="url(#glow)">
      <animate attributeName="r" values="80;100;85;95;80" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- top cap -->
    <path d="M178 118 L200 100 L222 118 Z" fill="url(#g)"/>
    <rect x="176" y="118" width="48" height="6" rx="3" fill="url(#g)"/>

    <!-- body -->
    <rect x="180" y="124" width="40" height="64" rx="6" fill="#FFD166" fill-opacity="0.18" stroke="url(#g)" stroke-width="3"/>

    <!-- flame -->
    <ellipse cx="200" cy="162" rx="8" ry="15" fill="#FFB703">
      <animate attributeName="ry" values="15;18;13;17;15" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="8;6;9;7;8" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="166" rx="4" ry="8" fill="#FFF3B0"/>

    <!-- base -->
    <rect x="176" y="188" width="48" height="8" rx="3" fill="url(#g)"/>
  </g>

  <!-- ground -->
  <ellipse cx="200" cy="285" rx="70" ry="6" fill="#F4A300" fill-opacity="0.25"/>

  <!-- question mark -->
  <text x="290" y="170" font-family="monospace" font-size="48" fill="url(#g)" opacity="0.8">?
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="95" y="140" font-family="monospace" font-size="30" fill="url(#g)" opacity="0.6">NaN
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
