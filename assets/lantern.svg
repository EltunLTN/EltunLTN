<svg viewBox="0 0 400 290" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F4A300" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F4A300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floating data bits -->
  <g font-family="monospace" font-size="16" fill="#FFD166">
    <text x="70" y="250" opacity="0">1<animateTransform attributeName="transform" type="translate" values="0 0; 0 -150" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite"/></text>
    <text x="110" y="270" opacity="0">0<animateTransform attributeName="transform" type="translate" values="0 0; 0 -170" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="1s" repeatCount="indefinite"/></text>
    <text x="300" y="260" opacity="0">1<animateTransform attributeName="transform" type="translate" values="0 0; 0 -160" dur="5.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="5.5s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="335" y="240" opacity="0">0<animateTransform attributeName="transform" type="translate" values="0 0; 0 -140" dur="4.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></text>
  </g>

  <!-- NaN and ? -->
  <text x="45" y="150" font-family="monospace" font-size="30" font-weight="bold" fill="#FFD166" opacity="0.8">NaN
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="318" y="160" font-family="monospace" font-size="54" font-weight="bold" fill="#F4A300" opacity="0.8">?
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- barrel (pithos) -->
  <ellipse cx="200" cy="280" rx="62" ry="6" fill="#000" opacity="0.35"/>
  <path d="M146 238 Q132 262 146 278 L254 278 Q268 262 254 238 Z" fill="#1C2541" stroke="#F4A300" stroke-width="2.5"/>
  <ellipse cx="200" cy="238" rx="54" ry="9" fill="#0B132B" stroke="#F4A300" stroke-width="2.5"/>
  <path d="M138 252 Q200 268 262 252" fill="none" stroke="#FFD166" stroke-width="2" opacity="0.7"/>
  <path d="M138 266 Q200 282 262 266" fill="none" stroke="#FFD166" stroke-width="2" opacity="0.7"/>

  <!-- swinging lantern -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-12 200 8; 12 200 8; -12 200 8" dur="3.6s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <circle cx="200" cy="140" r="115" fill="url(#glow)">
      <animate attributeName="r" values="105;125;110;120;105" dur="2s" repeatCount="indefinite"/>
    </circle>

    <line x1="200" y1="8" x2="200" y2="58" stroke="#FFD166" stroke-width="3"/>
    <circle cx="200" cy="62" r="6" fill="none" stroke="#FFD166" stroke-width="3"/>

    <path d="M166 92 L200 68 L234 92 Z" fill="#F4A300"/>
    <rect x="162" y="92" width="76" height="9" rx="4" fill="#E85D04"/>

    <rect x="170" y="101" width="60" height="84" rx="8" fill="#FFD166" fill-opacity="0.18" stroke="#FFD166" stroke-width="3"/>
    <line x1="200" y1="101" x2="200" y2="185" stroke="#FFD166" stroke-width="1.5" opacity="0.35"/>

    <ellipse cx="200" cy="150" rx="11" ry="22" fill="#FFB703">
      <animate attributeName="ry" values="22;26;19;25;22" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="11;9;12;10;11" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="157" rx="5" ry="11" fill="#FFF3B0"/>

    <rect x="162" y="185" width="76" height="10" rx="4" fill="#E85D04"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
