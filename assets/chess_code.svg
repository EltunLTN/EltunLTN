<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#151B26"/>
  </linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00C9FF"/>
    <stop offset="0.5" stop-color="#6A5ACD"/>
    <stop offset="1" stop-color="#FF2D95"/>
  </linearGradient>
</defs>

<rect width="1000" height="310" rx="20" fill="url(#bg)" stroke="#30363d"/>
<text x="500" y="36" text-anchor="middle" fill="url(#g)" font-family="monospace" font-size="21" font-weight="700">CODING × CHESS</text>

<!-- chess board -->
<g transform="translate(70,68)">
  <rect width="240" height="240" rx="10" fill="#161b22" stroke="#30363d"/>
  <!-- board squares -->
  <g>
    <rect x="20" y="20" width="25" height="25" fill="#c9d1d9"/><rect x="45" y="20" width="25" height="25" fill="#2d333b"/>
    <rect x="70" y="20" width="25" height="25" fill="#c9d1d9"/><rect x="95" y="20" width="25" height="25" fill="#2d333b"/>
    <rect x="120" y="20" width="25" height="25" fill="#c9d1d9"/><rect x="145" y="20" width="25" height="25" fill="#2d333b"/>
    <rect x="170" y="20" width="25" height="25" fill="#c9d1d9"/><rect x="195" y="20" width="25" height="25" fill="#2d333b"/>

    <rect x="20" y="45" width="25" height="25" fill="#2d333b"/><rect x="45" y="45" width="25" height="25" fill="#c9d1d9"/>
    <rect x="70" y="45" width="25" height="25" fill="#2d333b"/><rect x="95" y="45" width="25" height="25" fill="#c9d1d9"/>
    <rect x="120" y="45" width="25" height="25" fill="#2d333b"/><rect x="145" y="45" width="25" height="25" fill="#c9d1d9"/>
    <rect x="170" y="45" width="25" height="25" fill="#2d333b"/><rect x="195" y="45" width="25" height="25" fill="#c9d1d9"/>

    <rect x="20" y="70" width="25" height="25" fill="#c9d1d9"/><rect x="45" y="70" width="25" height="25" fill="#2d333b"/>
    <rect x="70" y="70" width="25" height="25" fill="#c9d1d9"/><rect x="95" y="70" width="25" height="25" fill="#2d333b"/>
    <rect x="120" y="70" width="25" height="25" fill="#c9d1d9"/><rect x="145" y="70" width="25" height="25" fill="#2d333b"/>
    <rect x="170" y="70" width="25" height="25" fill="#c9d1d9"/><rect x="195" y="70" width="25" height="25" fill="#2d333b"/>

    <rect x="20" y="95" width="25" height="25" fill="#2d333b"/><rect x="45" y="95" width="25" height="25" fill="#c9d1d9"/>
    <rect x="70" y="95" width="25" height="25" fill="#2d333b"/><rect x="95" y="95" width="25" height="25" fill="#c9d1d9"/>
    <rect x="120" y="95" width="25" height="25" fill="#2d333b"/><rect x="145" y="95" width="25" height="25" fill="#c9d1d9"/>
    <rect x="170" y="95" width="25" height="25" fill="#2d333b"/><rect x="195" y="95" width="25" height="25" fill="#c9d1d9"/>

    <rect x="20" y="120" width="25" height="25" fill="#c9d1d9"/><rect x="45" y="120" width="25" height="25" fill="#2d333b"/>
    <rect x="70" y="120" width="25" height="25" fill="#c9d1d9"/><rect x="95" y="120" width="25" height="25" fill="#2d333b"/>
    <rect x="120" y="120" width="25" height="25" fill="#c9d1d9"/><rect x="145" y="120" width="25" height="25" fill="#2d333b"/>
    <rect x="170" y="120" width="25" height="25" fill="#c9d1d9"/><rect x="195" y="120" width="25" height="25" fill="#2d333b"/>

    <rect x="20" y="145" width="25" height="25" fill="#2d333b"/><rect x="45" y="145" width="25" height="25" fill="#c9d1d9"/>
    <rect x="70" y="145" width="25" height="25" fill="#2d333b"/><rect x="95" y="145" width="25" height="25" fill="#c9d1d9"/>
    <rect x="120" y="145" width="25" height="25" fill="#2d333b"/><rect x="145" y="145" width="25" height="25" fill="#c9d1d9"/>
    <rect x="170" y="145" width="25" height="25" fill="#2d333b"/><rect x="195" y="145" width="25" height="25" fill="#c9d1d9"/>

    <rect x="20" y="170" width="25" height="25" fill="#c9d1d9"/><rect x="45" y="170" width="25" height="25" fill="#2d333b"/>
    <rect x="70" y="170" width="25" height="25" fill="#c9d1d9"/><rect x="95" y="170" width="25" height="25" fill="#2d333b"/>
    <rect x="120" y="170" width="25" height="25" fill="#c9d1d9"/><rect x="145" y="170" width="25" height="25" fill="#2d333b"/>
    <rect x="170" y="170" width="25" height="25" fill="#c9d1d9"/><rect x="195" y="170" width="25" height="25" fill="#2d333b"/>

    <rect x="20" y="195" width="25" height="25" fill="#2d333b"/><rect x="45" y="195" width="25" height="25" fill="#c9d1d9"/>
    <rect x="70" y="195" width="25" height="25" fill="#2d333b"/><rect x="95" y="195" width="25" height="25" fill="#c9d1d9"/>
    <rect x="120" y="195" width="25" height="25" fill="#2d333b"/><rect x="145" y="195" width="25" height="25" fill="#c9d1d9"/>
    <rect x="170" y="195" width="25" height="25" fill="#2d333b"/><rect x="195" y="195" width="25" height="25" fill="#c9d1d9"/>
  </g>

  <text x="58" y="157" text-anchor="middle" fill="#39FF14" font-family="monospace" font-size="31">♞</text>
  <animateMotion href="" dur="4.5s" repeatCount="indefinite"/>
  <text x="56" y="158" text-anchor="middle" fill="#39FF14" font-family="monospace" font-size="31">
    ♞
    <animate attributeName="x" values="56;181;131;181;56" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="158;133;108;58;158" dur="5s" repeatCount="indefinite"/>
  </text>

  <path d="M56 150 Q112 144 179 125 Q152 101 130 99 Q167 55 181 49" fill="none" stroke="#39FF14" stroke-width="3" stroke-dasharray="8 7">
    <animate attributeName="stroke-dashoffset" values="0;-30" dur="1.1s" repeatCount="indefinite"/>
  </path>
</g>

<!-- middle bridge -->
<g>
  <path d="M350 154 H460" stroke="#6A5ACD" stroke-width="6" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <polygon points="460,154 440,144 440,164" fill="#6A5ACD"/>
  <text x="404" y="132" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="15">search tree → algorithm</text>
</g>

<!-- code terminal -->
<g transform="translate(490,72)">
  <rect width="440" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="85" y="25" fill="#8b949e" font-family="monospace" font-size="15">engine.py</text>

  <text x="24" y="60" fill="#ff7b72" font-family="monospace" font-size="16">def</text>
  <text x="60" y="60" fill="#d2a8ff" font-family="monospace" font-size="16">best_move</text>
  <text x="147" y="60" fill="#c9d1d9" font-family="monospace" font-size="16">(position):</text>

  <text x="42" y="88" fill="#ff7b72" font-family="monospace" font-size="16">for</text>
  <text x="76" y="88" fill="#c9d1d9" font-family="monospace" font-size="16">move</text>
  <text x="118" y="88" fill="#ff7b72" font-family="monospace" font-size="16">in</text>
  <text x="140" y="88" fill="#c9d1d9" font-family="monospace" font-size="16">legal_moves:</text>

  <text x="60" y="116" fill="#ff7b72" font-family="monospace" font-size="16">score</text>
  <text x="110" y="116" fill="#c9d1d9" font-family="monospace" font-size="16">= evaluate(move)</text>

  <text x="60" y="144" fill="#ff7b72" font-family="monospace" font-size="16">if</text>
  <text x="81" y="144" fill="#c9d1d9" font-family="monospace" font-size="16">score &gt; best_score:</text>

  <text x="78" y="172" fill="#c9d1d9" font-family="monospace" font-size="16">best_score = score</text>
  <text x="78" y="198" fill="#c9d1d9" font-family="monospace" font-size="16">best = move</text>
  <text x="24" y="224" fill="#ff7b72" font-family="monospace" font-size="16">return</text>
  <text x="82" y="224" fill="#c9d1d9" font-family="monospace" font-size="16">best</text>

  <rect x="83" y="212" width="9" height="18" fill="#39FF14">
    <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="500" y="289" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="17">In chess and code, the strongest move is the one you can justify.</text>
</svg>