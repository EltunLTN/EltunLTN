<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00C9FF"/>
    <stop offset="0.5" stop-color="#6A5ACD"/>
    <stop offset="1" stop-color="#FF2D95"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1000" height="190" rx="20" fill="#0D1117" stroke="#30363d"/>
<text x="500" y="42" text-anchor="middle" fill="url(#g)" font-family="monospace" font-size="20" font-weight="700" filter="url(#glow)">PHILOSOPHY.EXE</text>

<g text-anchor="middle" font-family="monospace" font-size="26" fill="#f0f6fc">
  <text x="500" y="112" opacity="0">“Code is philosophy with a compiler.” 
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.27;0.32;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="112" opacity="0">“A model predicts. An engineer takes responsibility.”
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.37;0.59;0.64;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="500" y="112" opacity="0">“Every bug is an assumption asking to be corrected.”
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.69;0.94;1" dur="12s" repeatCount="indefinite"/>
  </text>
</g>

<circle cx="420" cy="154" r="4" fill="#00C9FF">
  <animate attributeName="cx" values="420;580;420" dur="3s" repeatCount="indefinite"/>
</circle>
<line x1="420" y1="154" x2="580" y2="154" stroke="#30363d" stroke-width="3"/>
</svg>