<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#151B26"/>
  </linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00C9FF"/>
    <stop offset="0.5" stop-color="#6A5ACD"/>
    <stop offset="1" stop-color="#FF2D95"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1000" height="230" rx="20" fill="url(#bg)" stroke="#30363d"/>
<circle cx="38" cy="30" r="7" fill="#ff5f56"/>
<circle cx="62" cy="30" r="7" fill="#ffbd2e"/>
<circle cx="86" cy="30" r="7" fill="#27c93f"/>
<text x="115" y="36" fill="#8b949e" font-family="monospace" font-size="16">probabil_thoughts.md</text>

<g>
  <text x="500" y="78" text-anchor="middle" fill="url(#grad)" font-family="Georgia, serif" font-size="30" font-weight="700" filter="url(#glow)">“God does not play dice.”</text>
  <text x="500" y="107" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="18">— Albert Einstein</text>
</g>

<g>
  <rect x="116" y="136" width="118" height="58" rx="12" fill="#161b22" stroke="#00C9FF"/>
  <text x="175" y="170" text-anchor="middle" fill="#00C9FF" font-family="monospace" font-size="18">CHAOS</text>
  <text x="175" y="191" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">raw uncertainty</text>

  <path d="M242 165 H404" stroke="#39FF14" stroke-width="5" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <rect x="404" y="136" width="192" height="58" rx="12" fill="#161b22" stroke="#6A5ACD"/>
  <text x="500" y="170" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="17">Probability + Logic</text>
  <text x="500" y="191" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">the language of patterns</text>

  <path d="M605 165 H768" stroke="#39FF14" stroke-width="5" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <rect x="768" y="136" width="116" height="58" rx="12" fill="#161b22" stroke="#FF2D95"/>
  <text x="826" y="170" text-anchor="middle" fill="#FF2D95" font-family="monospace" font-size="18">MODEL</text>
  <text x="826" y="191" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">learned structure</text>
</g>

<g>
  <rect x="58" y="148" width="34" height="34" rx="6" fill="#0D1117" stroke="#30363d">
    <animateTransform attributeName="transform" type="rotate" values="0 75 165;15 75 165;0 75 165" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="75" y="171" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="19">⚄</text>
</g>
</svg>