<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#151B26"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1000" height="250" rx="18" fill="url(#bg)" stroke="#30363d"/>
<circle cx="30" cy="28" r="7" fill="#ff5f56"/>
<circle cx="54" cy="28" r="7" fill="#ffbd2e"/>
<circle cx="78" cy="28" r="7" fill="#27c93f"/>
<text x="105" y="35" fill="#8b949e" font-family="monospace" font-size="16">train.py — definitely_final_v12.py</text>

<g font-family="monospace" font-size="21">
  <text x="35" y="82" fill="#39FF14">$ python train.py</text>

  <text x="35" y="122" fill="#c9d1d9" opacity="0">
    Epoch 1/100 — train_accuracy: 99.9%
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="35" y="160" fill="#ffbd2e" opacity="0">
    validation_accuracy: 51.0%
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.42;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="35" y="205" fill="#ff5f56" font-weight="700" opacity="0" filter="url(#glow)">
    OVERFITTING HAS ENTERED THE CHAT.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.58;0.92;1" dur="8s" repeatCount="indefinite"/>
  </text>
</g>

<rect x="35" y="218" width="11" height="22" fill="#39FF14">
  <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
</rect>
</svg>